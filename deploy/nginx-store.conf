# nginx config that serves the built React frontend (static files).
# Installed to /etc/nginx/conf.d/store.conf by the deploy workflow.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: send unknown paths to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
